name: Checks

# Deploys are handled by the Cloudflare Pages GitHub integration, so this
# workflow only validates. It must not publish anything, or it would race the
# integration to production.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: Site checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run site checks
        run: npm test

      # Proves the deployable output can still be assembled, and that nothing
      # which should not ship reaches it, even while Pages serves the repo root.
      - name: Build deployable output
        run: npm run build

      - name: Install accessibility-test browser
        run: npx playwright install --with-deps chromium

      - name: Run WCAG accessibility checks
        run: npm run test:a11y

  live-smoke:
    name: Live deployment smoke test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Wait for Pages and verify production
        shell: bash
        env:
          VERIFY_CONTENT: '1'
        run: |
          for attempt in {1..24}; do
            if node tools/smoke-live.js; then
              exit 0
            fi
            echo "Deployment not ready (attempt ${attempt}/24); retrying in 15 seconds."
            sleep 15
          done
          exit 1
